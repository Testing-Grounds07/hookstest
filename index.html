<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D WebGL Memory Palace</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#09121a;color:#eee4d2;font-family:Arial}header{height:68px;padding:12px 20px;background:#0e1924;border-bottom:1px solid #30434e;display:flex;align-items:center;justify-content:space-between}h1{font:24px Georgia;margin:3px 0}small{letter-spacing:2px;color:#82988f}.layout{height:calc(100% - 68px);display:grid;grid-template-columns:1fr 280px}#stage{position:relative;min-width:0}.side{padding:20px;background:#101b27;border-left:1px solid #30434e}.side h2{font:22px Georgia}.side p{font-size:13px;line-height:1.5;color:#abb7b1}.side button{width:100%;margin:5px 0;padding:10px;background:#365d51;color:#fff;border:1px solid #638177;border-radius:5px}.log{margin-top:15px;padding:10px;background:#162530;border-left:2px solid #638177;font:11px/1.45 monospace;color:#9cafaa}.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#cbbfa9;background:#121a20;z-index:4}@media(max-width:800px){.layout{grid-template-columns:1fr}.side{position:absolute;right:8px;bottom:8px;width:250px;z-index:5;border:1px solid #30434e;border-radius:7px;background:#101b27ee;padding:14px}}</style></head><body><header><div><small>MEMORY PALACE · TRUE 3D WEBGL</small><h1>Token Plant · Classroom Diorama</h1></div><small>THREE.JS</small></header><div class="layout"><main id="stage"><div id="loading" class="loading">Loading 3D room…</div></main><aside class="side"><h2>3D test</h2><p>This room is geometry now: floor, walls, window, chalkboard, desks, podium, books, plant and mug. No raster background.</p><button id="plant">Focus plant</button><button id="podium">Focus podium</button><button id="reset">Reset camera</button><div id="log" class="log">Initializing…</div></aside></div><script type="module">
const stage=document.querySelector('#stage'),loading=document.querySelector('#loading'),log=document.querySelector('#log');try{
const THREE=await import('https://cdn.jsdelivr.net/npm/three@0.180.0/+esm');log.textContent='Three.js loaded';
const scene=new THREE.Scene();scene.background=new THREE.Color(0xbca680);scene.fog=new THREE.Fog(0xbca680,8,22);
const camera=new THREE.PerspectiveCamera(48,stage.clientWidth/stage.clientHeight,.1,100);camera.position.set(0,3.2,8.8);camera.lookAt(0,2,-2);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.setSize(stage.clientWidth,stage.clientHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;stage.appendChild(renderer.domElement);loading.remove();log.textContent+='\nRenderer ready';
const mat=(c,r=.65,m=.05)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});const wood=mat(0x68452f,.62),darkWood=mat(0x3a281f,.72),wall=mat(0xc4ad89,.9),green=mat(0x29483b,.88),paper=mat(0xe8dcc2,.95),terra=mat(0xa95736,.82),leaf=mat(0x63734b,.8),cream=mat(0xe6dac2,.85);
function box(n,size,pos,ma){const g=new THREE.BoxGeometry(...size),o=new THREE.Mesh(g,ma);o.name=n;o.position.set(...pos);o.castShadow=o.receiveShadow=true;scene.add(o);return o}
box('floor',[12,.18,12],[0,-.1,-2],darkWood);box('back',[12,6,.18],[0,3,-7],wall);box('left',[.18,6,12],[-6,3,-2],wall);box('right',[.18,6,12],[6,3,-2],wall);
box('chalkboard',[5.3,2.4,.15],[1.1,3.7,-6.82],green);box('chalkframe',[5.7,.12,.25],[1.1,4.95,-6.68],wood);box('chalkframe',[5.7,.12,.25],[1.1,2.45,-6.68],wood);
const windowFrame=box('window',[2.8,3.4,.12],[-4.1,3.6,-6.75],darkWood);const glass=new THREE.Mesh(new THREE.PlaneGeometry(2.45,3.05),new THREE.MeshPhysicalMaterial({color:0xbfd0c6,transparent:true,opacity:.34,roughness:.12,transmission:.25}));glass.position.set(-4.1,3.6,-6.65);scene.add(glass);box('wmid',[.09,3.05,.15],[-4.1,3.6,-6.55],darkWood);box('wmid',[2.45,.09,.15],[-4.1,3.6,-6.55],darkWood);
function desk(x,z,s=1){box('desk',[2.2*s,.16,1*s],[x,.85,z],wood);box('leg',[.14*s,1.7,.14*s],[x-.85*s,0,z-.3*s],darkWood);box('leg',[.14*s,1.7,.14*s],[x+.85*s,0,z-.3*s],darkWood)}
desk(-3.8,-3.8,.9);desk(-.8,-4.2,.85);desk(2.6,-4.1,.85);desk(-3.2,-.8,1.05);
const podium=box('podium',[1.65,2.8,1.15],[3.9,1.4,-2.6],wood);box('podiumTop',[2,.18,1.5],[3.9,2.86,-2.55],mat(0x93613e,.55));
function book(x,y,z,c,w=1.1){return box('book',[w,.16,.7],[x,y,z],mat(c,.72))}
book(-3.65,1.05,-.75,0x793b3d,1.45);book(-3.65,1.24,-.75,0x405f50,1.3);book(-3.65,1.43,-.75,0xb06c3d,1.15);
const syllabus=box('syllabus',[1.7,.06,1.2],[-1.55,1.03,-.25],paper);syllabus.rotation.y=-.22;
const pot=new THREE.Group();pot.name='plant';const potMesh=new THREE.Mesh(new THREE.CylinderGeometry(.62,.48,.95,32),terra);potMesh.position.y=.48;potMesh.castShadow=true;pot.add(potMesh);const soil=new THREE.Mesh(new THREE.CylinderGeometry(.55,.55,.05,32),mat(0x2d2119,1));soil.position.y=.96;pot.add(soil);
for(let i=0;i<11;i++){const a=(i/11)*Math.PI*2,stem=new THREE.Mesh(new THREE.CylinderGeometry(.025,.035,1.4+(i%3)*.25,8),mat(0x4f5735,.9));stem.position.set(Math.cos(a)*.18,1.55,Math.sin(a)*.18);stem.rotation.z=Math.cos(a)*.24;pot.add(stem);for(let j=0;j<2;j++){const lf=new THREE.Mesh(new THREE.SphereGeometry(.28,14,8),leaf);lf.scale.set(1.8,.28,1);lf.position.set(Math.cos(a)*(.55+j*.25),1.45+j*.48,Math.sin(a)*(.55+j*.25));lf.rotation.y=-a;lf.rotation.z=(i%2?-.25:.25);pot.add(lf)}}pot.position.set(.75,1,-1.3);scene.add(pot);
const mug=new THREE.Group();const cup=new THREE.Mesh(new THREE.CylinderGeometry(.27,.23,.55,24),cream);cup.castShadow=true;mug.add(cup);const handle=new THREE.Mesh(new THREE.TorusGeometry(.22,.055,8,20,Math.PI*1.5),cream);handle.rotation.y=Math.PI/2;handle.position.set(.3,.02,0);mug.add(handle);mug.position.set(4.25,3.25,-2.55);scene.add(mug);
const hemi=new THREE.HemisphereLight(0xffe4b2,0x2b3440,1.35);scene.add(hemi);const sun=new THREE.DirectionalLight(0xffd59a,4.5);sun.position.set(-4.5,6,1);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);const fill=new THREE.PointLight(0x88a6a0,20,9);fill.position.set(3,3,1);scene.add(fill);
const target=new THREE.Vector3(0,1.8,-2.2),home={p:camera.position.clone(),t:target.clone()};let goalP=home.p.clone(),goalT=home.t.clone(),mx=0,my=0;
stage.addEventListener('pointermove',e=>{const r=stage.getBoundingClientRect();mx=(e.clientX-r.left)/r.width-.5;my=(e.clientY-r.top)/r.height-.5});
function focus(obj,dist=3){const wp=new THREE.Vector3();obj.getWorldPosition(wp);goalT.copy(wp);goalP.set(wp.x+1.5,wp.y+1.6,wp.z+dist);log.textContent='Camera focus: '+obj.name}
document.querySelector('#plant').onclick=()=>focus(pot,3.5);document.querySelector('#podium').onclick=()=>focus(podium,4);document.querySelector('#reset').onclick=()=>{goalP.copy(home.p);goalT.copy(home.t);log.textContent='Camera reset'};
function tick(){camera.position.lerp(goalP,.045);target.lerp(goalT,.045);camera.position.x+=mx*.002;camera.position.y-=my*.001;camera.lookAt(target);renderer.render(scene,camera);requestAnimationFrame(tick)}tick();
addEventListener('resize',()=>{camera.aspect=stage.clientWidth/stage.clientHeight;camera.updateProjectionMatrix();renderer.setSize(stage.clientWidth,stage.clientHeight)});
}catch(e){loading.textContent='3D initialization failed: '+e.message;log.textContent='ERROR: '+e.stack}
</script></body></html>
