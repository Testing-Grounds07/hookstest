<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vector Room Lab</title><style>*{box-sizing:border-box}body{margin:0;background:#0c151f;color:#eee5d4;font-family:Arial}header{padding:18px 24px;background:#101c29;border-bottom:1px solid #334854;display:flex;justify-content:space-between;gap:14px;align-items:center}h1{font:26px Georgia;margin:3px 0}small{letter-spacing:2px;color:#819a90}.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button,.motion{padding:9px 11px;border:1px solid #526a66;background:#172733;color:#ddd;border-radius:5px}.tabs .active,.motion{background:#486e61}.wrap{display:grid;grid-template-columns:minmax(0,1fr) 250px}.room{background:#bba17c;min-width:0}.room svg{display:block;width:100%;height:auto}.info{padding:22px;background:#111d29;border-left:1px solid #334854}.info h2{font:22px Georgia}.info p{font-size:14px;line-height:1.55;color:#aeb9b3}.texture,.fine,.micro{display:none}.d2 .texture,.d3 .texture,.d4 .texture{display:block}.d3 .fine,.d4 .fine{display:block}.d4 .micro{display:block}.d1 .soft{opacity:.18}.d2 .soft{opacity:.32}.d3 .soft{opacity:.52}.d4 .soft{opacity:.68}.animate .leaf{animation:droop 2.7s ease-in-out infinite alternate}.animate .ray{animation:ray 5s ease-in-out infinite alternate}.animate .paper{animation:paper 4s ease-in-out infinite alternate}@keyframes droop{to{opacity:.82}}@keyframes ray{to{opacity:.48;transform:translateX(12px)}}@keyframes paper{to{transform:translateY(-4px)}}@media(max-width:800px){header{align-items:flex-start;flex-direction:column}.wrap{grid-template-columns:1fr}.info{border-left:0;border-top:1px solid #334854}}</style></head><body><header><div><small>MEMORY PALACE · 100% SVG</small><h1>Full Room Fidelity Lab</h1></div><div class="tabs"><button data-n="1">V1 Basic</button><button data-n="2">V2 Editorial</button><button data-n="3" class="active">V3 Cinematic</button><button data-n="4">V4 Max Detail</button></div></header><div cla ipse class="leaf" cx="128" cy="65" rx="52" ry="24" transform="rotate(38 128 65)"/><ellipse class="leaf" cx="288" cy="52" rx="52" ry="24" transform="rotate(-42 288 52)"/><ellipse class="leaf" cx="73" cy="205" rx="61" ry="28" transform="rotate(15 73 205)"/><ellipse class="leaf" cx="352" cy="190" rx="61" ry="28" transform="rotate(-18 352 190)"/><ellipse class="leaf" cx="148" cy="170" rx="52" ry="24" transform="rotate(28 148 170)"/><ellipse class="leaf" cx="273" cy="164" rx="52" ry="24" transform="rotate(-28 273 164)"/></g><ellipse cx="210" cy="294" rx="124" ry="35" fill="#d6804f" stroke="#462319" stroke-width="7"/><path d="M94 300h232l-31 145q-5 20-27 20H151q-22 0-27-20z" fill="#a95432" stroke="#462319" stroke-width="8"/><ellipse cx="210" cy="300" rx="106" ry="22" fill="#2e2118"/><path d="M123 350h174v70H123z" fill="#eadbbd" stroke="#654431" stroke-width="4"/><text x="210" y="393" text-anchor="middle" fill="#33251d" font-family="Georgia" font-size="30" font-weight="700">DIVERSITY</text><g class="fine" stroke="#e2a25e" opacity=".5"><path d="M30 115q50 5 90 0M300 105q40 5 80-3M25 205q50 7 95 0"/></g></g><g><path d="M0 635l515-68 135 193H0z" fill="url(#wood)" stroke="#38251c" stroke-width="8"/><g class="texture"><path d="M20 665q240-65 500-62M20 705q260-62 550-58" fill="none" stroke="#d7a071" opacity=".25" stroke-width="4"/></g><g transform="translate(230 585) rotate(-7)"><path d="M0 0l245-28 35 125L28 130z" fill="#eee2c8" stroke="#6e5844" stroke-width="6"/><text x="135" y="30" text-anchor="middle" font-family="Georgia" font-size="18" fill="#4b4034">SYLLABUS</text><path d="M45 50l175-20M50 72l180-20M56 94l160-18" stroke="#9c8b75" stroke-width="4"/><text class="fine" x="70" y="118" font-family="Arial" font-size="10" fill="#8d4c40">NEW TEXT ADDED</text></g></g><g transform="translate(1030 570)"><path d="M0 0h105v90H12Q0 90 0 78z" fill="#e8dfcb" stroke="#5c5042" stroke-width="6"/><path d="M105 18h20q22 0 22 23t-22 25h-20" fill="none" stroke="#5c5042" stroke-width="10"/><text x="53" y="40" text-anchor="middle" font-family="Georgia" font-size="13" fill="#5c5042">GOOD</text><text x="53" y="58" text-anchor="middle" font-family="Georgia" font-size="13" fill="#5c5042">INTENTIONS</text><path class="micro" d="M25 72h56" stroke="#985f48" stroke-width="3"/></g><g class="micro" fill="#f5d99c" opacity=".45"><circle cx="380" cy="180" r="2"/><circle cx="450" cy="260" r="1.5"/><circle cx="700" cy="430" r="2"/><circle cx="330" cy="350" r="1"/><circle cx="810" cy="170" r="1.5"/></g></svg></div><aside class="info"><b>VECTOR ONLY</b><h2 id="ttl">V3 · Cinematic</h2><p id="txt">Perspective, layered gradients, cast shadows, directional light, irregular props and fine details.</p><p>Switch levels to compare how much complexity the entire SVG environment can carry.</p><button class="motion" id="motion">Pause motion</button></aside></div><script>const r=document.querySelector('#room'),t=document.querySelector('#ttl'),x=document.querySelector('#txt'),m=document.querySelector('#motion');const c={1:['V1 · Basic','Flat shapes, simple geometry and minimal shadows.'],2:['V2 · Editorial','Material cues, gradients, perspective and surface texture.'],3:['V3 · Cinematic','Perspective, layered gradients, cast shadows, directional light, irregular props and fine details.'],4:['V4 · Max Detail','Adds wood grain, chalk residue, glass reflections, leaf veins and atmospheric micro-detail.']};document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-n]').forEach(q=>q.classList.remove('active'));b.classList.add('active');const n=b.dataset.n,a=r.classList.contains('animate');r.className='room d'+n+(a?' animate':'');t.textContent=c[n][0];x.textContent=c[n][1]});m.onclick=()=>{r.classList.toggle('animate');m.textContent=r.classList.contains('animate')?'Pause motion':'Play motion'}</script></body></html>
